<script>/**
 * scripts.html - Utilidades compartidas del navegador.
 * Toda llamada al servidor pasa por api(), que exige respuestas {ok:true}
 * y convierte cualquier fallo en una excepcion con mensaje en espanol.
 */

const CODIGO_SESION_TERMINADA = 'SESION';
const CODIGO_SISTEMA_OCUPADO = 'OCUPADO';
const CODIGO_CUENTA_CAMBIADA = 'CUENTA';

// Reintentos cuando el servidor esta saturado (muchas cargas a la vez).
// Google admite unas 30 ejecuciones simultaneas por cuenta y todas las de la
// app corren con la cuenta que la desplego, asi que en picos hay que esperar
// turno. La espera crece hasta ESPERA_MAXIMA y es aleatoria (entre la mitad y
// el total) para que los navegadores no reintenten todos en el mismo instante.
// En el peor caso se espera alrededor de 2.5 minutos antes de rendirse.
const MAXIMO_REINTENTOS = 8;
const ESPERA_BASE_REINTENTO_MS = 2000;
const ESPERA_MAXIMA_REINTENTO_MS = 30000;

// Fallos de Google por exceso de ejecuciones simultaneas; ocurren antes de
// ejecutar la funcion, por eso reintentar no duplica escrituras.
const PATRON_SATURACION_GOOGLE = /simult|too many|demasiad|rate limit|service invoked/i;

/**
 * Ejecuta una funcion del servidor y devuelve una promesa con su respuesta.
 */
function llamarServidor(nombreFuncion, datos) {
  return new Promise(function (resolver, rechazar) {
    google.script.run
      .withSuccessHandler(resolver)
      .withFailureHandler(function (error) {
        rechazar(new Error(error && error.message ? error.message : 'No se pudo contactar con el servidor.'));
      })
      [nombreFuncion](datos || {});
  });
}

/**
 * Llama una funcion api* del servidor y lanza Error si ok no es true.
 * Los errores de validacion conservan su lista de detalles (error.errores).
 * opciones.alReintentar(numeroIntento) avisa a la vista que se esta esperando turno.
 */
async function api(nombreFuncion, datos, opciones) {
  const alReintentar = opciones && opciones.alReintentar;
  for (let intento = 0; ; intento++) {
    try {
      return await llamarApiUnaVez(nombreFuncion, datos);
    } catch (error) {
      const saturado = error.codigo === CODIGO_SISTEMA_OCUPADO || (!error.codigo && PATRON_SATURACION_GOOGLE.test(error.message));
      if (!saturado || intento >= MAXIMO_REINTENTOS) {
        throw error;
      }
      if (alReintentar) {
        alReintentar(intento + 1);
      }
      await esperar(calcularEsperaReintento(intento));
    }
  }
}

function calcularEsperaReintento(intento) {
  const techo = Math.min(ESPERA_MAXIMA_REINTENTO_MS, ESPERA_BASE_REINTENTO_MS * Math.pow(2, intento));
  return techo / 2 + Math.random() * (techo / 2);
}

function esperar(milisegundos) {
  return new Promise(function (resolver) {
    setTimeout(resolver, milisegundos);
  });
}

async function llamarApiUnaVez(nombreFuncion, datos) {
  const respuesta = await llamarServidor(nombreFuncion, datos);
  verificarCuentaDeRespuesta(respuesta);
  if (!respuesta || respuesta.ok !== true) {
    const error = new Error(respuesta && respuesta.mensaje ? respuesta.mensaje : 'Respuesta inválida del servidor.');
    error.codigo = respuesta && respuesta.codigo;
    error.errores = respuesta && respuesta.errores;
    if (error.codigo === CODIGO_SESION_TERMINADA) {
      mostrarSesionTerminada(error.message);
    }
    throw error;
  }
  return respuesta;
}

/**
 * Con varias cuentas de Google abiertas, la pagina puede haberse cargado con
 * una cuenta y el servidor responder con otra. El servidor ya rechaza lo que
 * el rol no permite; aqui se bloquea la vista para que nadie trabaje confundido.
 */
function verificarCuentaDeRespuesta(respuesta) {
  const correoPagina = String(document.body.dataset.correo || '').toLowerCase();
  const correoServidor = String((respuesta && respuesta.correoSesion) || '').toLowerCase();
  if (!correoPagina || !correoServidor || correoPagina === correoServidor) {
    return;
  }
  mostrarCuentaCambiada(correoPagina, correoServidor);
  const error = new Error('Tu navegador cambió de cuenta de Google. Recarga la página o elige una sola cuenta.');
  error.codigo = CODIGO_CUENTA_CAMBIADA;
  throw error;
}

function mostrarCuentaCambiada(correoPagina, correoServidor) {
  if (document.getElementById('bloqueo-cuenta')) {
    return;
  }
  const bloqueo = document.createElement('div');
  bloqueo.id = 'bloqueo-cuenta';
  bloqueo.className = 'bloqueo-cuenta';
  bloqueo.setAttribute('role', 'alertdialog');
  bloqueo.setAttribute('aria-modal', 'true');
  bloqueo.innerHTML =
    '<div class="bloqueo-cuenta-caja">' +
      '<h2>Se detectaron dos cuentas de Google</h2>' +
      '<p>Esta página se abrió con <strong>' + escapeHtml(correoPagina) + '</strong>, ' +
      'pero tu navegador está usando <strong>' + escapeHtml(correoServidor) + '</strong>.</p>' +
      '<p>Para evitar errores, elige la cuenta con la que quieres trabajar. ' +
      'Si usas varias cuentas, abre cada una en un perfil de Chrome distinto o en una ventana de incógnito.</p>' +
      '<div class="bloqueo-cuenta-acciones">' +
        '<a class="boton" target="_top" href="' + escapeHtml(document.body.dataset.urlCambiarCuenta || '') + '">Elegir cuenta</a>' +
        '<a class="boton boton-secundario" target="_top" href="' + escapeHtml(document.body.dataset.urlApp || '') + '">Recargar</a>' +
      '</div>' +
    '</div>';
  document.body.appendChild(bloqueo);
}

/**
 * Llena un selector de generacion con la respuesta del servidor
 * (generaciones, generacionActiva, generacion elegida y el valor de "Todas").
 * dataset.listo indica que ya hay una eleccion que enviar al servidor.
 */
function renderOpcionesGeneracion(select, respuesta) {
  const valorTodas = respuesta.valorTodasGeneraciones;
  const opciones = (respuesta.generaciones || []).map(function (generacion) {
    const etiqueta = generacion === respuesta.generacionActiva ? generacion + ' (activa)' : generacion;
    return '<option value="' + escapeHtml(generacion) + '">' + escapeHtml(etiqueta) + '</option>';
  });
  opciones.push('<option value="' + escapeHtml(valorTodas) + '">Todas</option>');
  select.innerHTML = opciones.join('');
  select.value = respuesta.generacion || valorTodas;
  select.dataset.listo = 'true';
}

/**
 * Filtro de generacion para el servidor: sin eleccion todavia, se omite
 * para que el servidor use la generacion activa.
 */
function leerFiltroGeneracion(select) {
  return select.dataset.listo ? select.value : undefined;
}

/**
 * La navegacion fuera del iframe exige un clic del usuario, por eso se
 * ofrece un enlace en vez de redirigir automaticamente.
 */
function mostrarSesionTerminada(mensaje) {
  const urlApp = document.body.dataset.urlApp || '';
  mostrarAviso(mensaje, 'error', urlApp ? { texto: 'Iniciar sesión', url: urlApp } : null, 0);
}

/**
 * Escapa texto antes de insertarlo en el HTML (RNF-06).
 */
function escapeHtml(texto) {
  return String(texto === undefined || texto === null ? '' : texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Muestra el aviso flotante global. duracionMs = 0 lo deja fijo.
 */
function mostrarAviso(texto, tipo, enlace, duracionMs) {
  let aviso = document.getElementById('aviso-global');
  if (!aviso) {
    aviso = document.createElement('div');
    aviso.id = 'aviso-global';
    document.body.appendChild(aviso);
  }
  aviso.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  aviso.textContent = texto;
  if (enlace) {
    const vinculo = document.createElement('a');
    vinculo.href = enlace.url;
    vinculo.target = '_top';
    vinculo.textContent = enlace.texto;
    aviso.appendChild(vinculo);
  }
  aviso.className = 'aviso ' + (tipo === 'error' ? 'aviso-error' : 'aviso-ok');
  aviso.hidden = false;
  clearTimeout(mostrarAviso.temporizador);
  if (duracionMs !== 0) {
    mostrarAviso.temporizador = setTimeout(ocultarAviso, duracionMs || 6000);
  }
}

function ocultarAviso() {
  const aviso = document.getElementById('aviso-global');
  if (aviso) {
    aviso.hidden = true;
  }
}

/**
 * Formatea una fecha ISO como fecha y hora local de Mexico.
 */
function formatearFechaHora(valor) {
  if (!valor) {
    return '-';
  }
  const fecha = new Date(valor);
  if (isNaN(fecha.getTime())) {
    return String(valor);
  }
  return fecha.toLocaleString('es-MX', {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

/**
 * Habilita/deshabilita un boton mientras dura una peticion.
 * Guarda el HTML para no perder el icono del boton.
 */
function marcarCargando(boton, cargando, textoReposo) {
  if (cargando) {
    boton.dataset.htmlReposo = boton.innerHTML;
    boton.disabled = true;
    boton.textContent = 'Procesando...';
  } else {
    boton.disabled = false;
    if (boton.dataset.htmlReposo) {
      boton.innerHTML = boton.dataset.htmlReposo;
    } else if (textoReposo) {
      boton.textContent = textoReposo;
    }
  }
}

/**
 * Texto visible del estatus con acentos; el valor interno no cambia.
 */
const ETIQUETAS_ESTATUS = {
  'Pendiente': 'Pendiente',
  'En Revision': 'En revisión',
  'Aprobado': 'Aprobado',
  'Observado': 'Observado',
  'Completo': 'Completo'
};

const CLASES_ESTATUS = {
  'Pendiente': 'estado-pendiente',
  'En Revision': 'estado-revision',
  'Aprobado': 'estado-aprobado',
  'Observado': 'estado-observado',
  'Completo': 'estado-aprobado'
};

function crearEtiquetaEstatus(estatus) {
  return '<span class="estado ' + (CLASES_ESTATUS[estatus] || 'estado-pendiente') + '">' +
    escapeHtml(ETIQUETAS_ESTATUS[estatus] || estatus) + '</span>';
}

/* ---------------- Linea de tiempo del historial ---------------- */

const TIPOS_DOCUMENTO_HISTORIAL = ['CURP', 'Acta de nacimiento', 'Certificado'];

/**
 * Frase legible para un registro: "Se cargó CURP", "CURP aprobado"...
 */
function describirEventoHistorial(registro) {
  const documento = registro.tipo_documento;
  if (documento === 'CORREO') {
    return 'Se envió un recordatorio por correo';
  }
  if (TIPOS_DOCUMENTO_HISTORIAL.indexOf(documento) === -1) {
    return documento + ': ' + registro.estatus_anterior + ' → ' + registro.estatus_nuevo;
  }
  if (registro.estatus_nuevo === 'En Revision') {
    return registro.estatus_anterior === 'Observado' ? 'Se volvió a cargar ' + documento : 'Se cargó ' + documento;
  }
  if (registro.estatus_nuevo === 'Aprobado') {
    return documento + ' aprobado';
  }
  if (registro.estatus_nuevo === 'Observado') {
    return documento + ' observado';
  }
  return documento + ': ' + (ETIQUETAS_ESTATUS[registro.estatus_nuevo] || registro.estatus_nuevo);
}

/**
 * Dibuja el historial como linea de tiempo.
 * opciones: { mostrarUsuario, mostrarEstudiante, vacio }
 */
function renderLineaTiempo(registros, opciones) {
  const config = opciones || {};
  if (!registros || !registros.length) {
    return '<p class="vacio">' + escapeHtml(config.vacio || 'Todavía no hay movimientos registrados.') + '</p>';
  }
  return '<ol class="linea-tiempo">' + registros.map(function (registro) {
    const clase = CLASES_ESTATUS[registro.estatus_nuevo] || 'estado-pendiente';
    const meta = [formatearFechaHora(registro.fecha_hora)];
    if (config.mostrarUsuario && registro.usuario) {
      meta.push(registro.usuario);
    }
    if (config.mostrarEstudiante && registro.matricula) {
      meta.push((registro.nombre_estudiante ? registro.nombre_estudiante + ' · ' : '') + registro.matricula);
    }
    // Solo se muestra el texto cuando aporta: motivo de observacion o cambios administrativos.
    const esDocumento = TIPOS_DOCUMENTO_HISTORIAL.indexOf(registro.tipo_documento) !== -1;
    const detalle = registro.observacion && (!esDocumento || registro.estatus_nuevo === 'Observado')
      ? '<p class="evento-detalle">' + escapeHtml(registro.observacion) + '</p>'
      : '';
    return '<li class="evento">' +
      '<span class="evento-punto ' + clase + '"></span>' +
      '<div class="evento-cuerpo">' +
        '<p class="evento-titulo">' + escapeHtml(describirEventoHistorial(registro)) + '</p>' +
        '<p class="evento-meta">' + escapeHtml(meta.join(' · ')) + '</p>' +
        detalle +
      '</div>' +
    '</li>';
  }).join('') + '</ol>';
}

function icono(nombre) {
  return '<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (TRAZOS_ICONOS[nombre] || '') + '</svg>';
}

/**
 * Sustituye cada <i data-icono="nombre"></i> del HTML estatico por su SVG.
 */
function pintarIconos(raiz) {
  (raiz || document).querySelectorAll('i[data-icono]').forEach(function (elemento) {
    elemento.outerHTML = icono(elemento.dataset.icono);
  });
}

document.addEventListener('DOMContentLoaded', function () {
  pintarIconos();
});
</script>
