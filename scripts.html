<script>/**
 * scripts.html - Utilidades compartidas del navegador.
 * Toda llamada al servidor pasa por api(), que exige respuestas {ok:true}
 * y convierte cualquier fallo en una excepcion con mensaje en espanol.
 */

/**
 * Ejecuta una funcion del servidor y devuelve una promesa con su respuesta.
 */
function llamarServidor(nombreFuncion, datos) {
  return new Promise(function (resolver, rechazar) {
    google.script.run
      .withSuccessHandler(resolver)
      .withFailureHandler(function (error) {
        rechazar(new Error(error && error.message ? error.message : 'No se pudo contactar con el servidor.'));
      })
      [nombreFuncion](datos || {});
  });
}

/**
 * Llama una funcion api* del servidor y lanza Error si ok no es true.
 * Los errores de validacion conservan su lista de detalles (error.errores).
 */
async function api(nombreFuncion, datos) {
  const respuesta = await llamarServidor(nombreFuncion, datos);
  if (!respuesta || respuesta.ok !== true) {
    const error = new Error(respuesta && respuesta.mensaje ? respuesta.mensaje : 'Respuesta invalida del servidor.');
    error.codigo = respuesta && respuesta.codigo;
    error.errores = respuesta && respuesta.errores;
    throw error;
  }
  return respuesta;
}

/**
 * Escapa texto antes de insertarlo en el HTML (RNF-06).
 */
function escapeHtml(texto) {
  return String(texto === undefined || texto === null ? '' : texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Muestra u oculta el aviso flotante global.
 */
function mostrarAviso(texto, tipo) {
  let aviso = document.getElementById('aviso-global');
  if (!aviso) {
    aviso = document.createElement('div');
    aviso.id = 'aviso-global';
    aviso.className = 'aviso';
    aviso.setAttribute('role', 'status');
    document.body.appendChild(aviso);
  }
  aviso.textContent = texto;
  aviso.className = 'aviso ' + (tipo === 'error' ? 'aviso-error' : 'aviso-ok');
  aviso.hidden = false;
  clearTimeout(mostrarAviso.temporizador);
  mostrarAviso.temporizador = setTimeout(ocultarAviso, 6000);
}

function ocultarAviso() {
  const aviso = document.getElementById('aviso-global');
  if (aviso) {
    aviso.hidden = true;
  }
}

/**
 * Formata una fecha ISO como fecha y hora local de Mexico.
 */
function formatearFechaHora(valor) {
  if (!valor) {
    return '-';
  }
  const fecha = new Date(valor);
  if (isNaN(fecha.getTime())) {
    return String(valor);
  }
  return fecha.toLocaleString('es-MX', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

/**
 * Habilita/deshabilita un boton mientras dura una peticion.
 */
function marcarCargando(boton, cargando, textoReposo) {
  if (cargando) {
    boton.dataset.textoReposo = boton.textContent;
    boton.disabled = true;
    boton.textContent = 'Procesando...';
  } else {
    boton.disabled = false;
    boton.textContent = boton.dataset.textoReposo || textoReposo || boton.textContent;
  }
}
</script>
